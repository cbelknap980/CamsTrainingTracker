<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d0f13">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Cam's Training Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="vendor/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/polish.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <span class="brand-name">Cam's Training Tracker</span>
      <span id="week-chip" class="chip"></span>
    </div>
    <div class="top-actions">
      <button id="sync-chip" class="sync-chip" hidden></button>
      <button id="settings-btn" class="icon-btn" aria-label="Settings" title="Settings">&#9881;</button>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav id="tabs">
    <button data-view="home" class="tab active">Home</button>
    <button data-view="progress" class="tab">Progress</button>
    <button data-view="plan" class="tab">Plan</button>
    <button data-view="runs" class="tab">Runs</button>
    <button data-view="nutrition" class="tab">Nutrition</button>
    <button data-view="architecture" class="tab">Architecture</button>
  </nav>

  <div id="toast" class="toast" hidden></div>
  <div id="modal" class="modal" hidden></div>

  <script src="vendor/xlsx.mini.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
